<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chani’s Role Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --ink:#18302A; --muted:#5B6F69; --line:#D3DFDA;
  --accent:#2F7D5B; --accent-ink:#FFFFFF; --tint:#DCEFE5; --gold:#E7B23C; --drain:#C2574A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111A17; --surface:#18241F; --ink:#E5EFEA; --muted:#9AB0A8; --line:#2B3B35;
    --accent:#5CC39A; --accent-ink:#0E1A15; --tint:#1F3A2E; --gold:#E9BE55; --drain:#E07A6C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A17; --surface:#18241F; --ink:#E5EFEA; --muted:#9AB0A8; --line:#2B3B35;
  --accent:#5CC39A; --accent-ink:#0E1A15; --tint:#1F3A2E; --gold:#E9BE55; --drain:#E07A6C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.1;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* growth track */
.track{position:relative;display:flex;justify-content:space-between;align-items:center;margin:8px 0 32px}
.track::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:4px;background:var(--line);border-radius:2px;transform:translateY(-50%)}
.track .fill{position:absolute;left:14px;top:50%;height:4px;background:var(--accent);border-radius:2px;transform:translateY(-50%);transition:width .45s ease}
.node{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font:600 13px Figtree,sans-serif;color:var(--muted);transition:all .3s}
.node.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.node.now{border-color:var(--accent);color:var(--accent);transform:scale(1.15)}
.node.leaf{border-radius:50% 0 50% 0}

.intro h1{font-size:clamp(2.3rem,7vw,3.6rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
.intro p{color:var(--muted);max-width:52ch;margin:0 0 14px}
.musts{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 30px}
.must{padding:7px 14px;border-radius:999px;background:var(--tint);font-weight:600;font-size:15px}

.step h2{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
.step .hint{color:var(--muted);margin:0 0 22px}

.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.chip{text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:500;transition:border-color .15s,background .15s}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.counter{margin-top:12px;color:var(--muted);font-size:15px}

.slider{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.slider .ends{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:15px;margin-bottom:6px}
.slider .ends span:last-child{text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}

.task{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{flex:1 1 240px;font-weight:500}
.rate{display:flex;gap:6px}
.rate button{padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.rate button[aria-pressed="true"][data-v="love"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate button[aria-pressed="true"][data-v="ok"]{background:var(--tint);border-color:var(--accent)}
.rate button[aria-pressed="true"][data-v="drain"]{border-color:var(--drain);color:var(--drain)}

.options{display:grid;gap:10px}
.opt{text-align:left;padding:16px 18px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px}
.btn{padding:13px 22px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:0;color:var(--muted);font-weight:600;padding:13px 6px}

/* results */
.result .lead{color:var(--muted);margin:0 0 6px}
.result .type{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:800;letter-spacing:-.03em;line-height:.98;color:var(--accent);margin-bottom:14px}
.result .tag{font-size:1.2rem;font-weight:500;margin:0 0 6px}
.result .runner{color:var(--muted);font-size:15px;margin:0 0 30px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.block h3{font-size:1.25rem;font-weight:700;margin-bottom:12px}
.titles{display:flex;flex-wrap:wrap;gap:8px}
.titles span{padding:6px 12px;border-radius:999px;background:var(--tint);font-weight:600;font-size:15px}
.fit{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.q{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q b{font-weight:600}
@media (max-width:520px){.q{grid-template-columns:1fr}}
.why{margin:0;padding-left:20px}
.why li{margin-bottom:4px}
.next{display:grid;gap:12px}
.next div{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:baseline}
.next .when{font-weight:700;color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.toast{color:var(--accent);font-weight:600;align-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
const TYPES = {
  sys:{name:"Systems Builder",tag:"You turn a mess into clear, repeatable process.",
    titles:["Operations Specialist","Process & SOP Coordinator","Systems Admin"],
    fit:{Fast:2,Quiet:3,Clear:3,Growing:3},
    q:[["What do I do?","Document, fix and maintain how the work gets done."],
       ["Who do I do it with?","Team leads. You own the SOP library."],
       ["How do I do it?","Map it, write it, test it, train it."],
       ["How is it measured?","SOPs live and used. Fewer repeat questions and errors."],
       ["When it breaks?","Find the step that failed, fix the doc, retrain."]],
    next:[["This week","Pick one messy process and map it in 5 steps."],
          ["30 days","Write and test 2 SOPs. Ask the team for feedback."],
          ["90 days","Own the SOP library for one business function."]]},
  exe:{name:"Execution Engine",tag:"You move work to done, fast and clean.",
    titles:["Project Coordinator","Operations Assistant","Executive Assistant"],
    fit:{Fast:3,Quiet:2,Clear:3,Growing:2},
    q:[["What do I do?","Keep tasks, deadlines and follow-ups moving."],
       ["Who do I do it with?","A leader or a project team."],
       ["How do I do it?","Daily task review, clean trackers, quick follow-ups."],
       ["How is it measured?","On-time completion. Nothing slips."],
       ["When it breaks?","Flag it the same day, reset the deadline, note the cause."]],
    next:[["This week","Track every task you finish for 5 days."],
          ["30 days","Own one project tracker end to end."],
          ["90 days","Run the weekly status update for a team or client."]]},
  data:{name:"Detail & Data Specialist",tag:"You bring accuracy and calm to numbers and information.",
    titles:["Data Coordinator","Admin & Bookkeeping Specialist","Reporting Analyst"],
    fit:{Fast:2,Quiet:3,Clear:3,Growing:2},
    q:[["What do I do?","Keep data clean and turn it into clear reports."],
       ["Who do I do it with?","Leaders who decide with the numbers you give them."],
       ["How do I do it?","Set the inputs, check weekly, report on a rhythm."],
       ["How is it measured?","Accuracy. Reports on time. Questions answered fast."],
       ["When it breaks?","Trace the bad number to its source and fix the input."]],
    next:[["This week","Clean one messy sheet. Note what you fixed."],
          ["30 days","Build one simple weekly report."],
          ["90 days","Own a numbers dashboard for one area."]]},
  client:{name:"Client Flow Coordinator",tag:"You keep people moving so nothing falls through.",
    titles:["Client Success Coordinator","Account Coordinator","Office Manager"],
    fit:{Fast:3,Quiet:1,Clear:2,Growing:2},
    q:[["What do I do?","Manage client touchpoints, scheduling and follow-ups."],
       ["Who do I do it with?","Clients on one side, the team on the other."],
       ["How do I do it?","A touchpoint calendar, reply templates, same-day answers."],
       ["How is it measured?","Response time. Follow-ups closed. Happy clients."],
       ["When it breaks?","Own the miss, reset expectations, fix the handoff."]],
    next:[["This week","List every client touchpoint you handle."],
          ["30 days","Write reply templates for the top 5."],
          ["90 days","Own the client onboarding flow."]]},
  create:{name:"Creative Producer",tag:"You make ideas look and read clearly.",
    titles:["Content Coordinator","Design Assistant","Marketing Assistant"],
    fit:{Fast:2,Quiet:3,Clear:2,Growing:2},
    q:[["What do I do?","Produce content, visuals and documents on schedule."],
       ["Who do I do it with?","Marketing or the founder."],
       ["How do I do it?","Brief, draft, review, publish on a calendar."],
       ["How is it measured?","On-time delivery, quality, engagement."],
       ["When it breaks?","Check the brief, fix the template, adjust the calendar."]],
    next:[["This week","Make 3 pieces and time yourself on each."],
          ["30 days","Build a reusable template set."],
          ["90 days","Own a content calendar."]]}
};

const STEPS = [
  {kind:"multi",max:3,title:"What gives you energy?",hint:"Pick up to 3.",
   items:[
    ["Crossing things off a list",{exe:2,sys:1}],
    ["Long stretches of quiet focus",{data:2,sys:1,create:1}],
    ["Turning a mess into order",{sys:2,data:1}],
    ["Knowing exactly what done looks like",{exe:2,data:1}],
    ["Learning a new tool or skill",{sys:1,data:1,create:1}],
    ["Helping someone get what they need",{client:2,exe:1}],
    ["Making something look good",{create:2}],
    ["Solving a puzzle",{data:2,sys:1}]]},
  {kind:"slider",title:"How do you like to work?",hint:"Slide toward what feels more like you.",
   items:[
    ["Steady and deep","Fast and many",{data:1,sys:1},{exe:1,client:1}],
    ["Heads-down alone","Talking with people",{data:1,sys:1,create:1},{client:2}],
    ["I build the plan","I run the plan",{sys:2},{exe:2}],
    ["Words and visuals","Numbers and systems",{create:2},{data:1,sys:1}]]},
  {kind:"rate",title:"Which tasks feel productive?",hint:"Rate each one. Go with your gut.",
   items:[
    ["Writing a step-by-step how-to guide",{sys:1}],
    ["Updating tasks and chasing deadlines",{exe:1}],
    ["Cleaning up a messy spreadsheet",{data:1}],
    ["Building a weekly report",{data:1,sys:.5}],
    ["Scheduling and client follow-ups",{client:1}],
    ["Mapping a workflow as a flowchart",{sys:1}],
    ["Designing a post or a slide",{create:1}],
    ["Prepping a meeting agenda and notes",{exe:1,client:.5}]]},
  {kind:"single",title:"What does growing look like for you?",hint:"Pick the one that excites you most.",
   items:[
    ["Becoming the go-to expert in one thing",{data:2,create:1}],
    ["Owning a whole area, start to finish",{sys:2,exe:1}],
    ["Handling more, faster and better",{exe:2}],
    ["Working closer with clients and leaders",{client:2}]]},
  {kind:"single",title:"Pick your ideal workday.",hint:"The one you’d happily repeat.",
   items:[
    ["Headphones on, one big project, done by 3",{data:2,sys:1,create:1}],
    ["A full list, knocking out 20 things",{exe:3}],
    ["Fixing what broke so it never breaks again",{sys:3}],
    ["Calls and follow-ups, everyone moving",{client:3}],
    ["Making something from scratch",{create:3}]]}
];

const KEY = "chani-role-finder-v1";
let state = load() || fresh();
function fresh(){return {step:-1,multi:[],slider:[2,2,2,2],rate:{},s3:null,s4:null};}
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function track(){
  const s = state.step;
  const pct = s<0?0:Math.min(s,5)/5*100;
  let html = `<div class="track" aria-label="Progress"><div class="fill" style="width:calc((100% - 28px) * ${pct/100})"></div>`;
  for(let i=0;i<6;i++){
    const cls = i<s?"done":(i===s?"now":"");
    html += `<div class="node ${cls} ${i===5?"leaf":""}" aria-label="${i===5?"Result":"Step "+(i+1)}">${i===5?"":i+1}</div>`;
  }
  return html+"</div>";
}

function render(){
  save();
  const s = state.step;
  if(s<0) return renderIntro();
  if(s>=5) return renderResult();
  const st = STEPS[s];
  let body = "";
  if(st.kind==="multi"){
    body = `<div class="chips">`+st.items.map((it,i)=>{
      const on = state.multi.includes(i);
      const dis = !on && state.multi.length>=st.max;
      return `<button class="chip" aria-pressed="${on}" ${dis?"disabled":""} data-multi="${i}">${esc(it[0])}</button>`;
    }).join("")+`</div><div class="counter">${state.multi.length} of ${st.max} picked</div>`;
  } else if(st.kind==="slider"){
    body = st.items.map((it,i)=>`<div class="slider"><div class="ends"><span>${esc(it[0])}</span><span>${esc(it[1])}</span></div>
      <input type="range" min="0" max="4" step="1" value="${state.slider[i]}" data-slider="${i}" aria-label="${esc(it[0])} to ${esc(it[1])}"></div>`).join("");
  } else if(st.kind==="rate"){
    body = `<div class="block">`+st.items.map((it,i)=>{
      const v = state.rate[i];
      return `<div class="task"><span class="t">${esc(it[0])}</span><div class="rate" role="group" aria-label="${esc(it[0])}">
        ${[["love","Love it"],["ok","It’s fine"],["drain","Drains me"]].map(([k,l])=>`<button data-rate="${i}" data-v="${k}" aria-pressed="${v===k}">${l}</button>`).join("")}
      </div></div>`;
    }).join("")+`</div>`;
  } else {
    const key = s===3?"s3":"s4";
    body = `<div class="options">`+st.items.map((it,i)=>`<button class="opt" aria-pressed="${state[key]===i}" data-single="${i}">${esc(it[0])}</button>`).join("")+`</div>`;
  }
  app.innerHTML = track()+`<section class="step"><h2>${esc(st.title)}</h2><p class="hint">${esc(st.hint)}</p>${body}
    <div class="nav"><button class="ghost" data-back>Back</button><button class="btn" data-next ${ready()?"":"disabled"}>${s===4?"See my role":"Next"}</button></div></section>`;
}

function ready(){
  const s = state.step;
  if(s===0) return state.multi.length>0;
  if(s===2) return Object.keys(state.rate).length===STEPS[2].items.length;
  if(s===3) return state.s3!==null;
  if(s===4) return state.s4!==null;
  return true;
}

function renderIntro(){
  app.innerHTML = track()+`<section class="intro">
    <h1>Hi Chani. Let’s find the role that fits you.</h1>
    <p>You said you like work that is fast, quiet, clear, and keeps you growing. That’s a great start.</p>
    <p>Five quick steps. About 3 minutes. At the end you get your role type, a simple framework for it, and your next steps.</p>
    <div class="musts"><span class="must">Fast</span><span class="must">Quiet</span><span class="must">Productive</span><span class="must">Clear</span><span class="must">Growing</span></div>
    <button class="btn" data-start>Start step 1</button></section>`;
}

function add(sc,w,m=1){for(const k in w) sc[k]+=w[k]*m;}
function score(){
  const sc = {sys:0,exe:0,data:0,client:0,create:0};
  const why = {sys:[],exe:[],data:[],client:[],create:[]};
  state.multi.forEach(i=>{const it=STEPS[0].items[i];add(sc,it[1]);for(const k in it[1]) if(it[1][k]>=2) why[k].push(`You get energy from: ${it[0].toLowerCase()}`);});
  state.slider.forEach((v,i)=>{const it=STEPS[1].items[i];add(sc,it[2],(4-v)/2);add(sc,it[3],v/2);});
  Object.entries(state.rate).forEach(([i,v])=>{const it=STEPS[2].items[i];const m=v==="love"?2:v==="ok"?.5:-1;add(sc,it[1],m);
    if(v==="love") for(const k in it[1]) if(it[1][k]>=1) why[k].push(`You love: ${it[0].toLowerCase()}`);});
  if(state.s3!==null){const it=STEPS[3].items[state.s3];add(sc,it[1]);for(const k in it[1]) if(it[1][k]>=2) why[k].push(`Growing means: ${it[0].toLowerCase()}`);}
  if(state.s4!==null){const it=STEPS[4].items[state.s4];add(sc,it[1]);for(const k in it[1]) if(it[1][k]>=2) why[k].push(`Your ideal day: ${it[0].toLowerCase()}`);}
  const ranked = Object.keys(sc).sort((a,b)=>sc[b]-sc[a]);
  const total = ranked.reduce((t,k)=>t+Math.max(sc[k],0),0)||1;
  return {ranked,sc,why,total};
}

function renderResult(){
  const {ranked,sc,why,total} = score();
  const top = TYPES[ranked[0]], second = TYPES[ranked[1]];
  const pct = Math.round(Math.max(sc[ranked[0]],0)/total*100);
  const reasons = why[ranked[0]].slice(0,4);
  app.innerHTML = track()+`<section class="result">
    <p class="lead">Your role type</p>
    <h1 class="type">${esc(top.name)}</h1>
    <p class="tag">${esc(top.tag)}</p>
    <p class="runner">Strongest match at ${pct}% of your answers. Runner-up: ${esc(second.name)}.</p>

    ${reasons.length?`<div class="block"><h3>Why this fits you</h3><ul class="why">${reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`:""}

    <div class="block"><h3>Your must-haves check</h3><div class="fit">
      ${Object.entries(top.fit).map(([k,v])=>`<span>${k}</span><div class="dots" aria-label="${k}: ${v} of 3">${[1,2,3].map(n=>`<i class="${n<=v?"on":""}"></i>`).join("")}</div>`).join("")}
    </div></div>

    <div class="block"><h3>Roles to look at</h3><div class="titles">${top.titles.map(t=>`<span>${esc(t)}</span>`).join("")}</div></div>

    <div class="block"><h3>Your role framework</h3>${top.q.map(([a,b])=>`<div class="q"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>

    <div class="block"><h3>Your next steps</h3><div class="next">${top.next.map(([w,t])=>`<div><span class="when">${esc(w)}</span><span>${esc(t)}</span></div>`).join("")}</div></div>

    <div class="actions"><button class="btn" data-copy>Copy my results</button><button class="ghost" data-restart>Start over</button><span class="toast" id="toast" role="status"></span></div>
  </section>`;
  app.dataset.summary = [
    `Chani’s role type: ${top.name}`, top.tag, `Runner-up: ${second.name}`, "",
    "Roles to look at: "+top.titles.join(", "), "",
    "Role framework:", ...top.q.map(([a,b])=>`- ${a} ${b}`), "",
    "Next steps:", ...top.next.map(([w,t])=>`- ${w}: ${t}`)
  ].join("\n");
}

app.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-start")){state.step=0;return render();}
  if(b.hasAttribute("data-back")){state.step--;return render();}
  if(b.hasAttribute("data-next")){if(ready()){state.step++;render();window.scrollTo({top:0});}return;}
  if(b.hasAttribute("data-restart")){state=fresh();return render();}
  if(b.dataset.multi!==undefined){const i=+b.dataset.multi;const a=state.multi;const at=a.indexOf(i);at>=0?a.splice(at,1):a.length<3&&a.push(i);return render();}
  if(b.dataset.rate!==undefined){state.rate[b.dataset.rate]=b.dataset.v;return render();}
  if(b.dataset.single!==undefined){state[state.step===3?"s3":"s4"]=+b.dataset.single;return render();}
  if(b.hasAttribute("data-copy")){
    const t=document.getElementById("toast");
    const txt=app.dataset.summary;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject())
      .then(()=>{t.textContent="Copied. Paste it to Blimi.";})
      .catch(()=>{t.textContent="Copy didn’t work here. Select the text above and copy it.";});
  }
});
app.addEventListener("input",e=>{
  if(e.target.dataset.slider!==undefined){state.slider[+e.target.dataset.slider]=+e.target.value;save();}
});
render();
</script>
</body>
</html>
