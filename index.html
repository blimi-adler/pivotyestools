<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools · structure</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-5 -5 29 32'%3E%3Crect x='-5' y='-5' width='29' height='32' rx='7' fill='%23F6F1E8'/%3E%3Crect x='0' y='0' width='19' height='5' rx='1.4' fill='%23292D30'/%3E%3Crect x='0' y='8.5' width='15' height='5' rx='1.4' fill='%23A33A32'/%3E%3Crect x='0' y='17' width='19' height='5' rx='1.4' fill='%23292D30'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  /* Structure brand. Cream page, ink text, white cards, red used once. */
  :root {
    --ink: #292D30;
    --red: #A33A32;
    --red-deep: #8E322B;
    --cream: #F6F1E8;
    --white: #FFFFFF;
    --sand: #ECE3D4;
    --line: #E3D9CA;
    --cardb: #DDD5C6;
    --stone: #6B6560;
    --ease: cubic-bezier(.22,.75,.22,1);
    --shadow: 0 24px 48px -32px rgba(41,45,48,.28);
    --max: 1080px;
  }
  html { scroll-behavior: smooth; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "DM Sans", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  header {
    max-width: var(--max);
    margin: 0 auto;
    padding: 56px 28px 8px;
  }
  .wordmark { display: block; height: 28px; width: auto; }
  .tagline {
    margin-top: 14px;
    font-size: 15px;
    color: var(--stone);
  }
  h1 {
    margin-top: 36px;
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 500;
    letter-spacing: -0.045em;
    line-height: 1.02;
  }
  h1 em { font-style: normal; color: var(--red); }
  .lede {
    margin-top: 16px;
    max-width: 36rem;
    font-size: 18px;
    color: var(--stone);
    line-height: 1.45;
  }

  .finder {
    position: sticky;
    top: 0;
    z-index: 5;
    background: color-mix(in srgb, var(--cream) 92%, transparent);
    backdrop-filter: blur(10px);
    padding: 20px 0 16px;
  }
  .finder-inner { max-width: var(--max); margin: 0 auto; padding: 0 28px; }
  .search-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .search {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--cardb);
    border-radius: 12px;
    background: var(--white);
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    outline: none;
    transition: border-color .2s var(--ease);
  }
  .search:focus { border-color: var(--ink); }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
  }
  .chip {
    border: 1px solid var(--cardb);
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background .2s var(--ease), border-color .2s var(--ease);
  }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .chip:focus-visible, .search:focus-visible, .tool-card:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .result-count { margin-left: auto; font-size: 13px; color: var(--stone); }

  main { max-width: var(--max); margin: 0 auto; padding: 8px 28px 72px; }
  .section { margin-bottom: 40px; }
  .section-label {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--stone);
    margin-bottom: 6px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); align-self: center; }
  .section-blurb { font-size: 14px; color: var(--stone); margin-bottom: 16px; max-width: 40rem; }
  .tools-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .tool-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 100%;
    padding: 22px 22px 18px;
    background: var(--white);
    border: 1px solid var(--cardb);
    border-radius: 18px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    transition: border-color .2s var(--ease), transform .2s var(--ease);
  }
  a.tool-card:hover { border-color: var(--ink); }
  a.tool-card:hover .card-go { transform: translateX(3px); color: var(--ink); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-place { font-size: 12px; font-weight: 500; color: var(--stone); letter-spacing: 0.01em; }
  .card-go { font-size: 13px; font-weight: 600; color: var(--stone); transition: transform .2s var(--ease), color .2s var(--ease); }
  .card-title { font-size: 20px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; }
  .card-desc { font-size: 15px; color: var(--stone); line-height: 1.45; }
  .badge {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    background: var(--sand);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .tool-card.is-unpublished { box-shadow: none; }
  .empty {
    display: none;
    padding: 28px;
    border: 1px dashed var(--cardb);
    border-radius: 18px;
    color: var(--stone);
    background: transparent;
  }
  .empty.show { display: block; }

  footer {
    max-width: var(--max);
    margin: 0 auto;
    padding: 22px 28px 40px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .footer-mark { height: 16px; width: auto; display: block; }
  .footer-note { font-size: 13px; color: var(--stone); }
  .footer-note a { color: var(--ink); text-underline-offset: 2px; }

  .gate-overlay {
    position: fixed;
    inset: 0;
    background: var(--cream);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
  }
  .gate-box {
    width: 100%;
    max-width: 400px;
    text-align: center;
    background: var(--white);
    border: 1px solid var(--cardb);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 40px 32px 32px;
  }
  .gate-logo { display: block; height: 26px; width: auto; margin: 0 auto 28px; }
  .gate-title { font-size: 32px; font-weight: 500; letter-spacing: -0.04em; line-height: 1.05; margin-bottom: 8px; }
  .gate-sub { font-size: 15px; color: var(--stone); margin-bottom: 24px; }
  .gate-input-wrap { display: flex; flex-direction: column; gap: 12px; }
  .gate-input {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--cream);
    outline: none;
    text-align: center;
    transition: border-color .2s var(--ease);
  }
  .gate-input:focus { border-color: var(--ink); background: var(--white); }
  .gate-input.error { border-color: var(--red); background: #F4E4E1; }
  .gate-btn {
    width: 100%;
    padding: 15px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background .2s var(--ease);
  }
  .gate-btn:hover { background: var(--red-deep); }
  .gate-error { font-size: 13px; color: var(--red); margin-top: 8px; min-height: 18px; font-weight: 500; }

  @media (max-width: 800px) {
    .tools-grid { grid-template-columns: 1fr; }
    .result-count { width: 100%; margin-left: 0; }
  }
  @media (max-width: 540px) {
    header { padding: 40px 20px 4px; }
    .finder-inner, main, footer { padding-left: 20px; padding-right: 20px; }
    h1 { margin-top: 28px; }
    .tool-card { border-radius: 16px; }
    footer { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-box">
    <img class="gate-logo" src="brand/structure-wordmark.svg" alt="structure">
    <h1 class="gate-title">Tools</h1>
    <p class="gate-sub">Enter your access code to continue.</p>
    <div class="gate-input-wrap">
      <input class="gate-input" type="password" id="gateInput" placeholder="Access code" autocomplete="current-password" onkeydown="if(event.key==='Enter')checkPassword()">
      <button class="gate-btn" type="button" onclick="checkPassword()">Enter &rarr;</button>
    </div>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<script>
var ACCESS_CODE = 'pivotyestools';

function checkPassword() {
  var input = document.getElementById('gateInput');
  var val = input.value.trim();
  if (val === ACCESS_CODE) {
    sessionStorage.setItem('py_auth', '1');
    document.getElementById('gateOverlay').style.display = 'none';
    input.classList.remove('error');
    document.getElementById('gateError').textContent = '';
    var search = document.getElementById('toolSearch');
    if (search) search.focus();
  } else {
    input.classList.add('error');
    document.getElementById('gateError').textContent = 'Incorrect code. Try again.';
    input.value = '';
    input.focus();
  }
}

(function () {
  if (sessionStorage.getItem('py_auth') === '1') {
    document.getElementById('gateOverlay').style.display = 'none';
  }
})();
</script>

<header>
  <img class="wordmark" src="brand/structure-wordmark.svg" alt="structure">
  <p class="tagline">Growth needs structure. We build it.</p>
  <h1>Every tool,<br><em>one place.</em></h1>
  <p class="lede">Client work, the freebies, and the tools the team uses. Search the list, then open the live page.</p>
</header>

<div class="finder">
  <div class="finder-inner">
    <label class="search-label" for="toolSearch">Search tools</label>
    <input class="search" id="toolSearch" type="search" placeholder="Search by name, client, or what it does" autocomplete="off">
    <div class="filters" role="group" aria-label="Filter by section">
      <button class="chip" type="button" data-section="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-section="client" aria-pressed="false">Client</button>
      <button class="chip" type="button" data-section="freebie" aria-pressed="false">Freebie</button>
      <button class="chip" type="button" data-section="internal" aria-pressed="false">Internal</button>
      <span class="result-count" id="resultCount" aria-live="polite"></span>
    </div>
  </div>
</div>

<main id="catalog"></main>

<footer>
  <img class="footer-mark" src="brand/structure-wordmark.svg" alt="structure">
  <span class="footer-note">Growth needs structure. We build it. <a href="https://structurefirm.com">structurefirm.com</a></span>
</footer>

<script>
/*
  Add a tool by appending an object to TOOLS.
  name          card title
  description   one line
  sections      one or more of "client", "freebie", "internal"
  url           live page, or null when it is not published
  A null url renders "Not published yet" and is not a link.
*/
var SECTIONS = [
  { id: "client", label: "Client tools", blurb: "Built for one client, or handed to a client to keep using." },
  { id: "freebie", label: "Freebie tools", blurb: "Lead magnets and owner guides. The people tools on tools.ceomode.biz, plus the ones that live beside them." },
  { id: "internal", label: "Internal tools", blurb: "For the structure team: money, proposals, methodology, and the way we assess a client’s people." }
];

var TOOLS = [
  {
    name: "MZS Call Console",
    description: "Guides an MZS maintenance call from the greeting through the work order, so every intake follows the same path.",
    sections: ["client"],
    url: "https://blimi-adler.github.io/pivotyestools/MZS_Maintenance.html"
  },
  {
    name: "Akiva Growth Incentive",
    description: "The quarterly growth incentive written for Akiva at Star Plans, so the upside shows up in the paycheck.",
    sections: ["client"],
    url: "https://blimi-adler.github.io/pivotyestools/akiva-incentive-plan.html"
  },
  {
    name: "Chani’s Role Finder",
    description: "A short questionnaire for Chani that lands on a role type, a simple framework, and the next steps.",
    sections: ["client"],
    url: "https://blimi-adler.github.io/pivotyestools/Chanirolefinder.html"
  },
  {
    name: "YP Mechanical Quote Builder",
    description: "Builds a YP Mechanical installation quote from the parts database, the job, and the inclusions.",
    sections: ["client"],
    url: "https://blimi-adler.github.io/ypquote/"
  },
  {
    name: "YP Mechanical Client Portal",
    description: "The engagement home for YP Mechanical: the work that has to come out of Yanky’s head and into a system.",
    sections: ["client"],
    url: "https://blimi-adler.github.io/ypquote/yp_mechanical_client_portal.html"
  },
  {
    name: "Health Garden Handoff",
    description: "The handoff for Health Garden, Honix, Sweet Valley, and Paterson, in one file the team can keep using.",
    sections: ["client"],
    url: "https://blimi-adler.github.io/client_portal/health-garden-handoff.html"
  },
  {
    name: "Sprinkler Head Takeoff",
    description: "Counts sprinkler heads on a Dousefire plan, with an NFPA 13 reference beside the drawing.",
    sections: ["client"],
    url: "https://blimi-adler.github.io/plans/"
  },
  {
    name: "Sprinkler Head Takeoff, later version",
    description: "A later Dousefire takeoff with a stepped workflow. The file is in the private plansdousefire repo.",
    sections: ["client"],
    url: null
  },
  {
    name: "The Right Hire Guide",
    description: "Five steps from the job definition to the decision, so a hire is run the same way every time.",
    sections: ["freebie"],
    url: "https://tools.ceomode.biz/hiring-tool.html"
  },
  {
    name: "The Performance Evaluation",
    description: "Walks a review from the role through scores, fit, pay, and the feedback plan before the conversation.",
    sections: ["freebie"],
    url: "https://tools.ceomode.biz/performance-evaluation-app.html"
  },
  {
    name: "The Role Clarity Tool",
    description: "Audits what someone actually does, names why the role broke, and builds a redistribution plan.",
    sections: ["freebie"],
    url: "https://tools.ceomode.biz/role-clarity-tool.html"
  },
  {
    name: "Offer Letter Generator",
    description: "Turns the role, the pay, and the terms into a ready-to-sign offer letter.",
    sections: ["freebie"],
    url: "https://tools.ceomode.biz/offer-letter-generator.html"
  },
  {
    name: "The Letting Go Guide",
    description: "Walks the decision to let someone go, from process versus person through the conversation itself.",
    sections: ["freebie"],
    url: "https://tools.ceomode.biz/letting-go-app-revised.html"
  },
  {
    name: "The Letting Go Guide, earlier version",
    description: "The earlier letting-go walkthrough, still published on the owner-tools site.",
    sections: ["freebie"],
    url: "https://blimi-adler.github.io/pivotyestools/letting-go-app.html"
  },
  {
    name: "Gratitude Vision Builder",
    description: "Turns fears, wants, and complaints into present-tense lines to read, picture, and write each morning.",
    sections: ["freebie"],
    url: "https://blimi-adler.github.io/pivotyestools/gratitude-vision-builder.html"
  },
  {
    name: "Launch Mode Workbook",
    description: "The module-by-module action guide for the Launch Mode business course.",
    sections: ["freebie"],
    url: "https://launchmode.biz/"
  },
  {
    name: "Launch Mode Workbook, earlier file",
    description: "An earlier copy of the Launch Mode workbook, still published next to the current course home.",
    sections: ["freebie"],
    url: "https://launchmode.biz/launch_mode_workbook.html"
  },
  {
    name: "Startup Budget and Margin Calculator",
    description: "Picks an industry, builds a startup budget, and shows where the margin and required sales stand.",
    sections: ["freebie"],
    url: "https://launchmode.biz/startup-budget-calculator.html"
  },
  {
    name: "Startup Budget, shorter page",
    description: "A shorter published page of the same startup budget and margin calculator.",
    sections: ["freebie"],
    url: "https://launchmode.biz/startup-budget.html"
  },
  {
    name: "Launch Mode intro",
    description: "The animated open for the Launch Mode course. The line on screen is “You have the instinct. We give you the map.”",
    sections: ["freebie"],
    url: "https://launchmode.biz/intro.html"
  },
  {
    name: "Financial Health Tracker",
    description: "The structure tracker for a client’s overhead, break-even, cash, pricing, and the QuickBooks checklist.",
    sections: ["internal"],
    url: "https://blimi-adler.github.io/financialtool/"
  },
  {
    name: "Monthly QB Review",
    description: "A monthly QuickBooks review: reconciliations, flags from the exports, and an issue list for the bookkeeper.",
    sections: ["internal"],
    url: "https://blimi-adler.github.io/financialtool/monthly-review.html"
  },
  {
    name: "Financial Health Tracker, PivotYes edition",
    description: "The earlier PivotYes-branded build of the financial health tracker. The structure edition above is the current one.",
    sections: ["internal"],
    url: "https://blimi-adler.github.io/financialtool/pivot_financial.html"
  },
  {
    name: "The Team Assessment",
    description: "For the structure team assessing a client’s people: who owns the work, who stays, and a page for each person.",
    sections: ["internal"],
    url: "https://blimi-adler.github.io/structure-internal-tools/team-assessment-tool.html"
  },
  {
    name: "Dousefire Proposal Builder",
    description: "Builds a Dousefire fire-sprinkler proposal from the scope, the price, and the standard exclusions.",
    sections: ["internal"],
    url: "https://blimi-adler.github.io/pivotyestools/Proposalbuilder.html"
  },
  {
    name: "PivotYes Methodology Portal",
    description: "The internal reference for the six business functions: what we do, per function and per phase, for every client.",
    sections: ["internal"],
    url: "https://blimi-adler.github.io/pivotyestools/pivotyes_methodology_portal.html"
  },
  {
    name: "PivotYes Hub",
    description: "The team system for clients, tasks, the client file, chat, and email. Sign-in is required.",
    sections: ["internal"],
    url: "https://pivotyes-hub.onrender.com/"
  }
];

var activeSection = "all";

function esc(value) {
  return String(value).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function placeLabel(url) {
  if (!url) return "";
  try {
    return new URL(url).host.replace(/^www\./, "");
  } catch (e) {
    return url;
  }
}

function matchesQuery(tool, query) {
  if (!query) return true;
  var haystack = (tool.name + " " + tool.description + " " + tool.sections.join(" ") + " " + (tool.url || "")).toLowerCase();
  return query.split(/\s+/).every(function (word) { return haystack.indexOf(word) !== -1; });
}

function cardHtml(tool) {
  var title = esc(tool.name);
  var desc = esc(tool.description);
  if (!tool.url) {
    return '<article class="tool-card is-unpublished">' +
      '<div class="card-top"><span class="badge">Not published yet</span></div>' +
      '<h3 class="card-title">' + title + '</h3>' +
      '<p class="card-desc">' + desc + '</p>' +
      '</article>';
  }
  return '<a class="tool-card" href="' + esc(tool.url) + '" target="_blank" rel="noopener noreferrer">' +
    '<div class="card-top"><span class="card-place">' + esc(placeLabel(tool.url)) + '</span><span class="card-go">Open →</span></div>' +
    '<h3 class="card-title">' + title + '</h3>' +
    '<p class="card-desc">' + desc + '</p>' +
    '</a>';
}

function render() {
  var query = document.getElementById("toolSearch").value.trim().toLowerCase();
  var catalog = document.getElementById("catalog");
  var shown = 0;
  var html = "";

  SECTIONS.forEach(function (section) {
    if (activeSection !== "all" && activeSection !== section.id) return;
    var tools = TOOLS.filter(function (tool) {
      return tool.sections.indexOf(section.id) !== -1 && matchesQuery(tool, query);
    });
    if (!tools.length) return;
    shown += tools.length;
    html += '<section class="section" id="section-' + section.id + '">' +
      '<h2 class="section-label">' + esc(section.label) + ' · ' + tools.length + '</h2>' +
      '<p class="section-blurb">' + esc(section.blurb) + '</p>' +
      '<div class="tools-grid">' + tools.map(cardHtml).join("") + '</div>' +
      '</section>';
  });

  if (!html) {
    html = '<p class="empty show" id="emptyState">Nothing matches that search. Try a client name, or clear the filter.</p>';
  }
  catalog.innerHTML = html;
  var noun = shown === 1 ? "tool" : "tools";
  document.getElementById("resultCount").textContent = shown + " " + noun;
}

document.getElementById("toolSearch").addEventListener("input", render);
document.querySelectorAll(".chip").forEach(function (chip) {
  chip.addEventListener("click", function () {
    activeSection = chip.getAttribute("data-section");
    document.querySelectorAll(".chip").forEach(function (other) {
      other.setAttribute("aria-pressed", other === chip ? "true" : "false");
    });
    render();
  });
});
render();
</script>
</body>
</html>
